services:
  db:
    image: postgres:18
    container_name: internship-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: internship_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: